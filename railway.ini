; Adminer on Railway (see README.md)
; Sessions, adminer.key and the failed-login log live on the /data volume, so logins
; and "permanent login" survive a redeploy.
session.save_path = /data/sessions
session.gc_maxlifetime = 86400
upload_tmp_dir = /data/tmp
; Railway terminates TLS: mark requests that arrived over HTTPS, so Adminer sets
; Secure cookies.
auto_prepend_file = /usr/local/etc/php/railway-prepend.php
; Room for SQL imports and exports.
upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
expose_php = Off
